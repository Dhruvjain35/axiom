# AXIOM :: the deployed demo, on one instance.
#
# API on :80, three workers beside it, all talking to CockroachDB Cloud. No database
# service here — the cluster is managed, which is the point of the project.
#
# The worker replicas are deliberately NOT `deploy.replicas`: each one is named, so the
# demo can kill a specific container by name on camera —
#
#     docker kill axiom-worker-2
#
# and watch Mission Control show another worker claim the orphaned task, bump the fence,
# and re-dispatch under the same idempotency key. `restart: unless-stopped` brings the
# killed worker back the way ECS or a supervisor would, which is what makes the recovery
# loop visible rather than a one-shot.

x-worker: &worker
  build:
    context: ../..
    dockerfile: Dockerfile
  command: ["python", "-m", "axiom.worker"]
  env_file: ../../.env
  environment:
    # Cloud BASIC's CA, fetched at boot by user-data.sh. psycopg reads this path from the
    # standard libpq location, so DATABASE_URL needs no sslrootcert parameter.
    PGSSLROOTCERT: /certs/root.crt
    PYTHONUNBUFFERED: "1"
  volumes:
    - /opt/axiom/certs:/certs:ro
  restart: unless-stopped
  # A t3.micro has 1 GB. Three Python workers plus the API fit, but only if none of them
  # is allowed to balloon — an OOM-killed worker would look like a chaos event and
  # muddy the one signal the demo exists to show.
  mem_limit: 220m

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "axiom.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../../.env
    environment:
      PGSSLROOTCERT: /certs/root.crt
      PYTHONUNBUFFERED: "1"
    volumes:
      - /opt/axiom/certs:/certs:ro
    ports:
      - "80:8000"
    restart: unless-stopped
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-1:
    <<: *worker
    container_name: axiom-worker-1
  worker-2:
    <<: *worker
    container_name: axiom-worker-2
  worker-3:
    <<: *worker
    container_name: axiom-worker-3
