[pytest]
# `.` on the path because AXIOM is run from the repo, not installed: tests/ has no
# __init__.py, so without this pytest inserts tests/ on sys.path and `import axiom` fails.
pythonpath = .
testpaths = tests
addopts = --strict-markers --tb=short
markers =
    slow: seeds thousands of rows or sleeps past a lease; still runs by default
xfail_strict = true
