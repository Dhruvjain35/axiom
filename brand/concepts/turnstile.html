<meta charset="utf-8">
<title>AXIOM — turnstile</title>
<style>
  :root{
    --bg:#0a0c0b; --panel:#0e1110; --raised:#161b19;
    --rule:#1d2220; --rule2:#2a302d; --rule3:#3a423e;
    --text:#dadfda; --dim:#8e958f; --faint:#5c635e; --ghost:#3d4441;
    --ok:#4fb98b; --hot:#e07b30;
    --mk:314px;                             /* mark tile: art is 251px tall inside it */
    --nudge:calc((32px - var(--mk)) / 2);   /* see the note on #mark below */
    --display:"Futura";   /* Futura Bold is a real face here — not a synthesised bold */
    --mono:Menlo;         /* "SF Mono" does not resolve on this machine; Menlo is the honest name */
  }
  html,body{margin:0;padding:0;background:var(--bg);overflow:hidden}
  body{width:1920px;height:1280px}

  /* The stage is exactly 1920x1280. The renderer makes the gallery tile by shrinking the
     viewport to 300x200, so the stage scales with it — otherwise that tile would be a crop
     of the top-left corner instead of the card. */
  .stage{position:relative;width:1920px;height:1280px;background:var(--bg);
         transform-origin:0 0;overflow:hidden}
  @media (max-width:800px){ .stage{transform:scale(0.15625)} }

  /* ---- mark -----------------------------------------------------------
     Stroke is 53.4px here; Futura Bold's stem at 272px is 53.3px. Same pen.
     For the favicon test the renderer rips #mark out of the document, drops it into a 32px
     grid and scales it about its own centre. The grid track grows to the mark's full 314px,
     so "place-items:center" never actually centres it and the mark scales down around a
     point 141px off-screen — a blank favicon. --nudge pulls the mark back by exactly that
     amount so it lands in the 32px box, and the slot adds it straight back on the card. */
  .markslot{position:absolute;left:calc(139px - var(--nudge));top:calc(466px - var(--nudge))}
  #mark{position:relative;left:var(--nudge);top:var(--nudge);
        width:var(--mk);height:var(--mk);background:var(--bg)}
  #mark svg{display:block;width:var(--mk);height:var(--mk)}
  .stroke{fill:var(--text)}

  /* ---- header rule, sitting on the top margin -------------------------
     It runs, it breaks, it runs again, and it still lands. */
  .rule{position:absolute;top:180px;height:8px;background:var(--rule2)}
  .r1{left:180px;width:967px}
  .r2{left:1223px;width:461px}
  .r3{left:1684px;width:56px;background:var(--hot)}

  /* ---- type ----------------------------------------------------------- */
  .word{position:absolute;left:632px;top:483px;font-family:var(--display);
        font-weight:700;font-size:272px;line-height:1;letter-spacing:.05em;
        color:var(--text)}
  .line{position:absolute;left:180px;top:932px;font-family:var(--mono);
        font-size:68px;line-height:1;color:var(--text);white-space:nowrap}
  .line b{font-weight:400;color:var(--dim)}
  .stamp{position:absolute;left:180px;top:1075px;width:1560px;text-align:right;
         font-family:var(--mono);font-size:30px;line-height:1;letter-spacing:.2em;
         color:var(--faint)}
  .stamp i{font-style:normal;margin-right:-.2em}
</style>

<div class="stage">

  <div class="rule r1"></div><div class="rule r2"></div><div class="rule r3"></div>

  <div class="markslot"><div id="mark">
    <svg viewBox="0 0 200 200">
      <!-- stem: full height, nothing standing behind it -->
      <rect class="stroke" x="26" y="20" width="34" height="160"/>
      <!-- arm: meets the stem, never crosses it -->
      <rect class="stroke" x="60" y="80" width="114" height="30"/>
    </svg>
  </div></div>

  <div class="word">AXIOM</div>
  <div class="line"><b>Agents crash.</b> The refund happens once.</div>

</div>
