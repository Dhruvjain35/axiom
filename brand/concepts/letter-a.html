<title>AXIOM — letter-a</title>

<!-- ============================================================================
     THE MARK — a drawn A, not a set one.

       · two strokes that never meet. the apex is cut open: the crash window.
       · unequal weight — thin rising stroke (27), heavy descending stroke (34),
         both cut flat top and bottom, no points, no joints to soften.
       · one crossbar, low (33% of cap height), thinner than the thin stroke
         because a long horizontal always reads heavier than it measures.
       · the crossbar is the only thing joining the two halves. it is the commit.
       · its left terminal is a hard vertical stop standing outside the letter:
         an axiom is what has nothing behind it.
       · its right terminal is sheared parallel to the leg, so the line reads as
         passing through the letter and continuing across the card.
     ========================================================================= -->

<svg class="card" viewBox="0 0 1920 1280" xmlns="http://www.w3.org/2000/svg">

  <!-- the commit line, continuing on the crossbar's axis to the edge -->
  <rect x="620" y="451" width="1300" height="3" fill="#2a302d"/>

  <svg id="mark" x="140" y="160" width="480" height="480" viewBox="0 0 256 256">
    <rect width="256" height="256" fill="#0a0c0b"/>
    <path d="M88.5 35 H115.5 L66 215 H39 Z" fill="#dadfda"/>
    <path d="M133.5 35 H167.5 L217 215 H183 Z" fill="#dadfda"/>
    <path d="M30 145.5 H197.8875 L203.6625 166.5 H30 Z" fill="#4fb98b"/>
  </svg>

  <text x="1780" y="426" text-anchor="end"
        font-family="Menlo" font-size="30" letter-spacing="6" fill="#5c635e">EFFECTIVELY-ONCE</text>

  <text x="140" y="900"
        font-family="Futura" font-weight="500" font-size="320" letter-spacing="38"
        fill="#dadfda">AXIOM</text>

  <text x="140" y="1035"
        font-family="Menlo" font-size="52" fill="#dadfda">Agents crash. The refund happens once.</text>

  <text x="1780" y="1035" text-anchor="end"
        font-family="Menlo" font-size="26" letter-spacing="3.2" fill="#3d4441">COCKROACHDB × AWS</text>
</svg>
